# nginx for the offline handbook: two static pages, plus the optional hands-on labs proxy.
#
# Labs (compose profile "labs"): /api/labs/ goes to the labs controller and /lab-term/<sid>/ to the
# ttyd terminal inside lab machine devlab-<sid>. Upstreams are variables resolved per request by
# Docker's embedded DNS, so nginx starts and serves the handbook when the labs are off; those
# routes then answer 502 and the page shows its read-only lab view. The one exception is
# /api/labs/health, which the page probes on every load: it answers 200 {"ok":false,"labs":"off"}
# instead, so a handbook without labs loads with a clean console.
#
# Terminal credential: each lab's ttyd runs with basic auth (`-c lab:<random per-session token>`),
# so another lab on devlab-net cannot open http://devlab-<sid>:7681. Only the controller knows the
# token; on a successful auth_request it returns it in X-Lab-Auth, and nginx sends it to ttyd as
# Authorization (the page, the websocket upgrade and ttyd's /token). The browser never sends or sees it.

# websocket upgrade for the terminal
map $http_upgrade $lab_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # index.html is ~14 MB; the build ships a gzip copy next to it (~3 MB on the wire)
    gzip_static on;

    # always revalidate, so a rebuilt page shows up at once (unchanged pages answer 304)
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's embedded DNS; names are looked up per request (never at start-up)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- labs API -> labs-controller:8080 (502 when the labs profile is not running)
    location /api/labs/ {
        set $labs_ctl labs-controller;
        proxy_pass http://$labs_ctl:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;      # with the port: the controller compares it with Origin
        proxy_set_header Connection "";
        # the address this request reached nginx on: the controller refuses requests that came
        # in over devlab-net (i.e. from inside a lab machine)
        proxy_set_header X-Lab-Via $server_addr;
        proxy_hide_header X-Lab-Auth;     # belt and braces: the credential never reaches the browser
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;          # starting a lab waits for systemd and setup.sh
        client_max_body_size 16k;
    }
    # ---- health probe: same proxy, but "labs off" is an answer, not an error (502/504 only when
    # nginx cannot reach the controller; the controller's own answers, e.g. 403, pass through)
    location = /api/labs/health {
        set $labs_ctl labs-controller;
        proxy_pass http://$labs_ctl:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Lab-Via $server_addr;
        proxy_hide_header X-Lab-Auth;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        error_page 502 504 = @labs_off;
    }
    location @labs_off {
        default_type application/json;
        return 200 '{"ok":false,"labs":"off"}\n';
    }
    # term-auth is for nginx's own auth_request subrequest only (it carries the ttyd credential)
    location = /api/labs/term-auth {
        return 404;
    }

    # ---- terminal: /lab-term/<12 hex>/... -> devlab-<sid>:7681 (ttyd), websocket included
    location ~ "^/lab-term/([a-f0-9]{12})$" {
        return 301 $uri/;
    }
    location ~ "^/lab-term/([a-f0-9]{12})/(.*)$" {
        set $lab_host devlab-$1;
        set $lab_path $2;
        auth_request /_lab_term_auth;     # only live sessions, never from inside a lab
        auth_request_set $lab_auth $upstream_http_x_lab_auth;
        proxy_pass http://$lab_host:7681/$lab_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection;
        proxy_set_header Host $http_host;      # with the port: the controller compares it with Origin
        # ttyd's basic auth, from the controller; this replaces any Authorization the client sent
        proxy_set_header Authorization $lab_auth;
        proxy_hide_header WWW-Authenticate;    # no browser login prompt if ttyd ever answers 401
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location = /_lab_term_auth {
        internal;
        set $labs_ctl labs-controller;
        proxy_pass http://$labs_ctl:8080/api/labs/term-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;      # with the port: the controller compares it with Origin
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Lab-Via $server_addr;
        proxy_set_header Authorization "";     # the client's own Authorization is never passed on
        proxy_connect_timeout 3s;
    }
}
